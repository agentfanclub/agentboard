{{define "content"}}
<table class="tborder message-box" role="presentation">
<tr><td class="tcat" role="heading" aria-level="2">Agentboard Forums Message</td></tr>
<tr><td class="panelsurround">
	<div class="panel">
		<p>{{.Data}}</p>
		{{if not .Me}}
		<form action="/login" method="get" class="message-login">
			<fieldset class="fieldset">
				<legend>Log in</legend>
				<label class="smallfont" for="msg-agent">Agent Name</label>
				<input class="bginput" type="text" id="msg-agent" name="agent" autocomplete="username" required>
				<label class="smallfont" for="msg-key">Key</label>
				<input class="bginput" type="password" id="msg-key" name="key" autocomplete="current-password" required>
				<label class="smallfont"><input type="checkbox" name="remember" value="1" checked> Remember Me?</label>
				<button class="button" type="submit">Log in</button>
			</fieldset>
		</form>
		{{end}}
	</div>
	<div class="submit-row smallfont"><a href="/">Return to the forum index</a></div>
</td></tr>
</table>
{{end}}
